<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 4 | Learn Arabic Language</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#222}
#loginPage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#071b35,#145b87,#087d76)}
.login-box{width:100%;max-width:420px;background:#fff;padding:40px 28px;border-radius:18px;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.25)}
.welcome{color:#123d62;font-size:25px;font-weight:bold;margin-bottom:12px}
.login-subtitle{color:#777;font-size:14px;margin-bottom:28px}
.lock-icon{font-size:48px;margin-bottom:18px}
.login-box input{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;font-size:16px;text-align:center;outline:none;margin-bottom:18px}
.login-box input:focus{border-color:#087d76}
.login-box button{width:100%;padding:14px;background:#087d76;color:#fff;border:0;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer}
.login-box button:hover{background:#065c57}
#error{color:#dc2626;font-size:14px;margin-top:15px}
#mainPage{display:none;padding:20px}
.container{max-width:950px;margin:auto}
.header{background:linear-gradient(135deg,#102d50,#1769aa);padding:30px 15px;text-align:center;color:#fff;border-radius:14px;margin-bottom:25px;box-shadow:0 5px 15px rgba(0,0,0,.12)}
.header h1{font-size:34px;letter-spacing:2px}
.header p{margin-top:10px;font-size:14px;opacity:.9}
.section{background:#fff;padding:25px;border-radius:13px;margin-bottom:25px;box-shadow:0 4px 15px rgba(0,0,0,.07)}
.section h2{text-align:center;color:#153d66;font-size:22px;margin-bottom:22px}
.video-player{width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden}
.video-player iframe{width:100%;height:100%;border:0}
.youtube-btn{display:block;width:fit-content;margin:22px auto 5px;padding:14px 28px;background:#d71920;color:#fff;text-decoration:none;font-size:16px;font-weight:bold;border-radius:8px;text-align:center;transition:.3s}
.youtube-btn:hover{background:#a90008;transform:translateY(-2px)}
.pdf-frame{width:100%;height:750px;border:0;border-radius:8px;background:#eee}
.footer{text-align:center;padding:22px 10px;color:#777;font-size:13px}
@media(max-width:600px){#mainPage{padding:10px}.header h1{font-size:27px}.section{padding:15px}.pdf-frame{height:550px}.welcome{font-size:22px}}
</style>
</head>
<body>
<div id="loginPage">
  <div class="login-box">
    <div class="lock-icon">🔐</div>
    <div class="welcome">Welcome To Learn Arabic Language</div>
    <p class="login-subtitle">Enter Your Passcode To Access The Lesson</p>
    <input type="password" id="passcode" placeholder="Enter Your Passcode" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">ENTER LESSON</button>
    <p id="error"></p>
  </div>
</div>

<div id="mainPage">
  <div class="container">
    <div class="header">
      <h1>LESSON 4</h1>
      <p>Learn Arabic Language | Educational Lesson</p>
    </div>
    <div class="section">
      <h2>🎬 VIDEO LESSON</h2>
      <div class="video-player">
        <iframe src="https://drive.google.com/file/d/1fV83yguW1s-PJ9FUh9hdQrplsTYMiKuZ/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
      <a href="https://www.youtube.com/@imranazhary" target="_blank" rel="noopener noreferrer" class="youtube-btn">▶ OUR YOUTUBE CHANNEL</a>
    </div>
    <div class="section">
      <h2>📘 LESSON PDF</h2>
      <iframe class="pdf-frame" src="https://drive.google.com/file/d/1IlCbM8_ElwzqsNcwGHAH3vrZGEq_O3Zj/preview"></iframe>
    </div>
    <div class="footer">© 2026 Learn Arabic Language<br><br>All Rights Reserved</div>
  </div>
</div>

<script>
function login(){
  const password=document.getElementById("passcode").value;
  if(password==="lesson4"){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainPage").style.display="block";
    window.scrollTo(0,0);
  }else{
    document.getElementById("error").innerText="Incorrect Passcode! Please Try Again.";
  }
}
</script>
</body>
</html>
